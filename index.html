<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power BI Dashboards · Trang Phan</title>
<meta name="description" content="A gallery of Power BI dashboards by Trang Phan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0F4C5C;--teal2:#2C8C8C;--mint:#B5DDD6;--orange:#E07A3F;--bg:#EEF3F5;--card:#fff;--ink:#1B2B34;--muted:#5B6C7A;--line:#DDE6EA}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F26;--card:#11303A;--ink:#E6F2F0;--muted:#A9B7C2;--line:#1E4450}}
  :root[data-theme="dark"]{--bg:#0B1F26;--card:#11303A;--ink:#E6F2F0;--muted:#A9B7C2;--line:#1E4450}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--teal);color:#fff;padding:56px 16px 48px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px);letter-spacing:-.02em}
  header p{margin:0;color:var(--mint);max-width:640px;line-height:1.5}
  header a{color:#fff}
  .bar{height:4px;width:64px;background:var(--orange);border-radius:2px;margin:18px 0}
  main{padding:40px 0 64px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;box-shadow:0 4px 18px rgba(15,76,92,.08);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(15,76,92,.16)}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top left;display:block;border-bottom:1px solid var(--line)}
  .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .meta{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal2)}
  .card h2{margin:0;font-size:20px}
  .card p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
  .tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 40px}
  footer a{color:var(--teal2)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Power BI Dashboards</h1>
    <div class="bar"></div>
    <p>A growing collection of interactive business dashboards. Each one has a live report, a screenshot and a write-up of the data and the insights.</p>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
</main>
<footer>
  Built by <a href="https://github.com/rachelnetherlands">Trang Phan</a> · Source on <a href="https://github.com/rachelnetherlands/powerbi-dashboards">GitHub</a>
</footer>
<script>
fetch('dashboards.json').then(r => r.json()).then(list => {
  const grid = document.getElementById('grid');
  list.sort((a, b) => b.date.localeCompare(a.date)).forEach(d => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `dashboards/${d.slug}/`;
    a.innerHTML = `
      <img src="${d.thumbnail}" alt="${d.title} dashboard screenshot" loading="lazy">
      <div class="body">
        <div class="meta">${d.domain} · ${d.date}</div>
        <h2>${d.title}</h2>
        <p>${d.summary}</p>
        <div class="tags">${d.tools.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>`;
    grid.appendChild(a);
  });
});
</script>
</body>
</html>
